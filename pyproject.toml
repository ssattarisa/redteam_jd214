[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssattarisa-redteam_jd214"
version = "0.1.0"
description = "按段落统计红队与内容安全工程师·多机通信的带宽瓶颈相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ssattarisa" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ssattarisa.github.io"
Repository = "https://github.com/ssattarisa/redteam_jd214"
Issues = "https://github.com/ssattarisa/redteam_jd214/issues"

[project.scripts]
redteam_jd214 = "redteam_jd214:main"

[tool.setuptools]
py-modules = ["redteam_jd214"]
